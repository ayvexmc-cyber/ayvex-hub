<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one app shell. Top bar with sliding tabs. Today = task list + side rail. Calendar = month grid + selected-day panel. Reminders = tasks with no due date. */
:root{
  --bg:#ffffff;
  --surface:#f4f7f6;
  --card:#ffffff;
  --wknd:#f9fbfa;
  --surface-2:#e9efed;
  --line:#e1e8e5;
  --fg:#15201c;
  --muted:#5b6964;
  --faint:#8c9a95;
  --accent:#0f7a63;
  --accent-hover:#0c6855;
  --accent-soft:#e2f1ec;
  --on-accent:#ffffff;
  --high:#d24a43; --high-soft:#fbe9e8;
  --med:#c3860f;  --med-soft:#fbf1dc;
  --low:#4b78a8;  --low-soft:#e6eef7;
  --shadow:0 1px 2px rgba(15,32,27,.05),0 6px 20px rgba(15,32,27,.07);
  --shadow-lg:0 2px 6px rgba(15,32,27,.06),0 18px 40px rgba(15,32,27,.12);
  --r:12px; --r-sm:8px; --r-xs:6px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}

.app{max-width:1180px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.brand{font:700 22px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.tabs{position:relative;display:flex;background:var(--surface);border-radius:10px;padding:4px}
.tab{position:relative;z-index:1;padding:6px 16px;border-radius:7px;color:var(--muted);font-weight:500;font-size:14px;transition:color .18s ease-out}
.tab[aria-selected="true"]{color:var(--fg)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--bg);border-radius:7px;box-shadow:0 1px 2px rgba(15,32,27,.08),0 2px 8px rgba(15,32,27,.06);transition:transform .22s cubic-bezier(.2,.8,.2,1),width .22s cubic-bezier(.2,.8,.2,1)}
.sync{margin-left:auto;font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync.warn{color:var(--med)}
/* Seasons: a branch hangs over the month header, the header takes a faint seasonal wash,
   and a few petals / leaves / flakes drift past while the calendar is open. */
#season-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.month-head{position:relative;z-index:2;transition:background .4s ease-out}
.month-head > *{position:relative;z-index:1}
.month-head .season-art{position:absolute;z-index:0;top:-2px;right:140px;width:360px;height:133px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(60,40,20,.12))}
.month-head.s-spring{background:linear-gradient(180deg,#fdf1f5,rgba(253,241,245,0))}
.month-head.s-summer{background:linear-gradient(180deg,#f3f8ea,rgba(243,248,234,0))}
.month-head.s-fall{background:linear-gradient(180deg,#fcf1e6,rgba(252,241,230,0))}
.month-head.s-winter{background:linear-gradient(180deg,#eef4fa,rgba(238,244,250,0))}
.season-pill{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:3px 10px;border-radius:99px;font:500 12px/1.4 var(--body);letter-spacing:0;vertical-align:middle;background:var(--bg);box-shadow:0 1px 2px rgba(15,32,27,.06)}
.season-pill svg{width:13px;height:13px;flex:none}
.s-spring .season-pill{color:#c2557a}
.s-summer .season-pill{color:#4f8a2e}
.s-fall .season-pill{color:#b8551f}
.s-winter .season-pill{color:#4a7397}
.season-art .sway{transform-box:fill-box;transform-origin:top center;animation:sway 6s ease-in-out infinite}
.season-art .sway.d2{animation-duration:7.5s;animation-delay:-2s}
.season-art .sway.d3{animation-duration:5.2s;animation-delay:-1s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (max-width:860px){.month-head .season-art{right:-20px;opacity:.55}}
@media (max-width:600px){.season-pill{display:none}}
@media (prefers-reduced-motion:reduce){#season-fx{display:none}.season-art .sway{animation:none}}
#foodframe{display:block;width:100%;height:900px;border:0;background:var(--bg)}
#foodview{margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;font-variant-numeric:tabular-nums}
.clock-time{font:700 24px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:baseline}
.clock-s{color:var(--faint);font-weight:500;font-size:16px;margin-left:2px}
.clock-ap{color:var(--muted);font:500 13px var(--body);margin-left:6px}
.clock-date{font-size:12px;color:var(--muted);margin-top:4px}
.desk{display:flex;align-items:center}
.desk:empty{display:none}
.desk .btn{height:32px;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.desk .btn:hover{background:var(--accent);color:var(--on-accent)}
.desk-note{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.desk-note.on svg{color:var(--accent)}

/* Shared */
h1,h2,h3{margin:0}
.eyebrow{font-size:13px;color:var(--muted);margin:0 0 4px}
.h1{font:700 36px/1.1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.h2{font:600 15px/1.3 var(--body);display:flex;align-items:center;gap:8px}
.h2 .count{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:500;font-size:14px;transition:background .15s ease-out,color .15s ease-out}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-quiet{color:var(--muted)}
.btn-quiet:hover{background:var(--surface);color:var(--fg)}
.btn-danger{color:var(--high)}
.btn-danger:hover,.btn-danger.armed{background:var(--high-soft)}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);transition:background .15s ease-out}
.icon-btn:hover{background:var(--surface);color:var(--fg)}
.field{height:36px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:0 10px;min-width:0}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.45}
.link{color:var(--accent);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}

/* Quick add */
.qa{background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.qa-row{display:flex;gap:8px}
.qa-title{flex:1;min-width:0;border:0;background:transparent;height:40px;padding:0 6px;font-size:16px}
.qa-title:focus{outline:none}
.qa-title::placeholder{color:var(--faint)}
.pill-field:has(input[type="time"]),.pill-field:has(input[type="date"]){cursor:pointer}
.pill-field input[type="time"],.pill-field input[type="date"]{cursor:pointer}
.qa-label{font-size:13px;color:var(--muted);padding:0 4px}
.qa-err{margin:0;padding:0 4px;font-size:13px;color:var(--high)}
.days{display:inline-flex;gap:4px;flex-wrap:wrap}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 6px;border-radius:var(--r-sm);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s ease-out,color .15s ease-out}
.ed-grid .days label{background:var(--bg)}
.days input:checked+label{background:var(--accent);color:var(--on-accent)}
.days input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.pri-routine{background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.pri-routine svg{width:12px;height:12px}
.task.routine .check{border-color:var(--accent)}
.ev-routine{background:var(--accent-soft)}
.ev-routine .check{border-color:var(--accent)}
.ev-ic{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--accent)}
.ev-ic svg{width:12px;height:12px}
.qa-hint{margin:0;padding:0 4px;font-size:12px;color:var(--faint)}
.qa-desc{border:0;background:transparent;height:28px;padding:0 6px;font-size:14px;color:var(--muted);margin-top:-6px}
.qa-desc:focus{outline:none;color:var(--fg)}
.qa-desc::placeholder{color:var(--faint)}
.task-desc{font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.task.done .task-desc{color:var(--faint)}
.task-del{flex:none;opacity:0;margin:-4px -4px 0 0;transition:opacity .15s ease-out,background .15s ease-out,color .15s ease-out}
.task:hover .task-del,.task-del:focus-visible,.task.open .task-del{opacity:1}
.task-del:hover{color:var(--high);background:var(--high-soft)}
@media (hover:none){.task-del{opacity:1}}
.qa-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 2px}
.qa-range{display:inline-flex;flex-wrap:wrap;gap:8px;animation:grow .18s cubic-bezier(.2,.8,.2,1);transform-origin:left}
.pill-field{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-sm);background:var(--surface);color:var(--muted);font-size:13px}
.pill-field input,.pill-field select{border:0;background:transparent;font-size:13px;color:var(--fg);height:30px;min-width:0}
.pill-field input:focus,.pill-field select:focus{outline:none}
.pill-field:focus-within{box-shadow:0 0 0 2px var(--accent-soft);color:var(--fg)}
.seg{display:inline-flex;background:var(--surface);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-xs);font-size:13px;color:var(--muted);cursor:pointer;transition:background .15s ease-out,color .15s ease-out}
.seg input:checked+label{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(15,32,27,.08)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-high{background:var(--high)} .d-med{background:var(--med)} .d-low{background:var(--low)}

/* Task list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.group{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:var(--r);transition:background .15s ease-out}
.task:hover{background:var(--surface)}
.task.open{background:var(--surface);border-bottom-left-radius:0;border-bottom-right-radius:0}
.check{width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.75px solid var(--faint);display:grid;place-items:center;transition:background .18s ease-out,border-color .18s ease-out;flex:none}
.p-high .check{border-color:var(--high)} .p-med .check{border-color:var(--med)} .p-low .check{border-color:var(--low)}
.check svg{width:12px;height:12px;color:var(--on-accent);stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .22s ease-out .05s}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{stroke-dashoffset:0}
.check:hover{background:var(--surface-2)}
.task.done .check:hover{background:var(--accent-hover)}
.task-body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.task-title{font-weight:500;overflow-wrap:anywhere;transition:color .18s ease-out}
.task.done .task-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.pri{font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px}
.pri-high{background:var(--high-soft);color:var(--high)} .pri-med{background:var(--med-soft);color:var(--med)} .pri-low{background:var(--low-soft);color:var(--low)}
.task.done .pri{opacity:.6}
.side-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bulk{display:flex;gap:4px}
.bulk .btn{height:30px;padding:0 10px;font-size:13px}
.bulk .btn svg{width:13px;height:13px}
.bulk .btn:disabled{opacity:.4;cursor:default;background:none}
.empty{padding:24px 12px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:12px}
.empty svg{color:var(--faint)}

/* Editor */
.editor{background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:4px 12px 16px 46px;display:flex;flex-direction:column;gap:12px;transform-origin:top;animation:grow .2s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{opacity:0;transform:scaleY(.96)}to{opacity:1;transform:none}}
.ed-title{font-weight:600;font-size:16px}
.ed-grid{display:flex;flex-wrap:wrap;gap:8px}
.ed-grid .pill-field{background:var(--bg)}
.ed-grid .seg{background:var(--bg)}
.ed-grid .seg input:checked+label{background:var(--surface-2)}
.ed-label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:-4px}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px;border-radius:var(--r-xs)}
.sub:hover{background:var(--surface-2)}
.sub .check{width:18px;height:18px;border-color:var(--faint)}
.sub .check svg{width:10px;height:10px}
.sub.done .check{background:var(--accent);border-color:var(--accent)}
.sub.done .check svg{stroke-dashoffset:0}
.sub-text{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.sub.done .sub-text{color:var(--faint);text-decoration:line-through}
.sub .icon-btn{width:26px;height:26px;opacity:0;transition:opacity .15s ease-out}
.sub:hover .icon-btn,.sub .icon-btn:focus-visible{opacity:1}
.sub-add{background:transparent;border:0;height:32px;padding:0 4px 0 30px;font-size:14px;width:100%}
.sub-add:focus{outline:none;background:var(--bg);border-radius:var(--r-xs)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* Today */
.home{display:flex;flex-direction:column;gap:24px}
.home-top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .up li button:hover{background:var(--bg)}
.card .cd{background:var(--bg)}
.card .cd.soon{background:var(--high-soft)}
.home-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.col{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.col .h2 svg{color:var(--accent)}
.col .h2.sub{font-size:13px;color:var(--muted)}
.col .group{gap:8px}
.col .task{padding:8px 8px}
.col .task:hover,.col .task.open{background:var(--bg)}
.col .editor{background:var(--bg);padding-left:12px}
.col .up li button:hover{background:var(--bg)}
/* compact density inside the three columns */
.home{gap:20px}
.home .h1,.dayview .h1{font-size:28px}
.home .qa,.dayview .qa{padding:10px;gap:6px}
.home .qa-title,.dayview .qa-title{height:34px;font-size:15px}
.home .qa-desc,.dayview .qa-desc{height:24px;font-size:13px}
.home .qa .pill-field,.dayview .qa .pill-field{height:28px;font-size:12px}
.home .qa .seg label,.dayview .qa .seg label{height:22px;font-size:12px;padding:0 8px}
.home .qa .btn-primary,.dayview .qa .btn-primary{height:32px}
.col{padding:12px;gap:10px}
.col .h2{font-size:14px}
.col .h2 svg{width:13px;height:13px}
.col .group{gap:4px}
.col .list{gap:0}
.col .task{padding:5px 6px;gap:8px;border-radius:var(--r-sm)}
.col .check{width:17px;height:17px;border-width:1.5px;margin-top:1px}
.col .check svg{width:9px;height:9px}
.col .task-title{font-size:13px;line-height:1.35}
.col .task-desc{font-size:12px;-webkit-line-clamp:1}
.col .meta{font-size:11px;gap:1px 8px}
.col .meta svg{width:11px;height:11px}
.col .pri{font-size:10px;padding:0 6px;line-height:16px}
.col .link{font-size:11px;white-space:nowrap}
.col .task-del{width:26px;height:26px}
.col .task-del svg{width:14px;height:14px}
.col .bulk .btn{height:24px;font-size:11px;padding:0 6px}
.col .bulk .btn svg{width:11px;height:11px}
.col .up li button{padding:5px 6px}
.col .up-t{font-size:13px}
.col .up-s{font-size:11px}
.col .rail-empty{font-size:13px}
.col .tl-any-label{font-size:11px;padding-left:6px}
.card{padding:12px}
.card .up li button{padding:5px 6px}
.card .up-t{font-size:13px}
.card .cd{font-size:13px;padding:5px 7px}
.rt-row{padding:4px 6px !important;gap:8px !important}
.rt-row .check{width:16px !important;height:16px !important}
.rt-t{font-size:13px !important}
.rt-time{font-size:11px !important;width:56px !important}
.rt-now{font-size:10px !important;padding:1px 6px !important}
.ev{padding:5px 8px}
.ev-t{font-size:12px}
.ev-s{font-size:11px}
.rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rt-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);transition:background .15s ease-out}
.rt-row:hover,.rt-row.open{background:var(--bg)}
.rt-row .check{width:18px;height:18px;border-color:var(--accent);margin:0}
.rt-row .check svg{width:10px;height:10px}
.rt-row.done .check{background:var(--accent)}
.rt-row.done .check svg{stroke-dashoffset:0}
.rt-body{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;text-align:left}
.rt-time{width:62px;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt-t{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-row.done .rt-t{text-decoration:line-through;color:var(--faint)}
.rt-row.past .rt-t,.rt-row.past .rt-time{color:var(--faint)}
.rt-row.now{background:var(--accent-soft)}
.rt-row.now .rt-t{color:var(--accent)}
.rt-now{flex:none;font-size:11px;font-weight:600;color:var(--on-accent);background:var(--accent);padding:2px 8px;border-radius:99px}
.today{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start}
.main{display:flex;flex-direction:column;gap:24px;min-width:0}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress strong{display:block;color:var(--fg);font-size:15px;font-weight:600}
.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.2,1)}
.rail{display:flex;flex-direction:column;gap:32px;min-width:0}

    `<input type="checkbox" id="${prefix}-${i}" ${attr} value="${i}" ${selected.includes(i) ? 'checked' : ''}><label for="${prefix}-${i}" title="${DAY_NAME[i]}">${DAY_SHORT[i]}</label>`).join('') + `</div>`;
}
const routinesOn = day => { const wd = parseKey(day).getDay(); return all().filter(x => x.kind === 'routine' && (x.days || []).includes(wd)).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1); };
function startMs(t){
  if (!t.date) return Infinity;
  const [y,m,d] = t.date.split('-').map(Number);
  const [hh,mm] = (t.time || '00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh, mm).getTime();
}
function remindAt(t){
  if (t.remind == null || !t.date) return null;
  const [y,m,d] = t.date.split('-').map(Number);
  const [hh,mm] = (t.time || '09:00').split(':').map(Number);
  return new Date(y, m-1, d, hh, mm).getTime() - t.remind * 60000;
}
function sortTasks(a, b){
  if (!!a.done !== !!b.done) return a.done ? 1 : -1;
  if (a.time && b.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
  if (!!a.time !== !!b.time) return a.time ? -1 : 1;
  const pr = PRI[a.priority||'med'].rank - PRI[b.priority||'med'].rank;
  if (pr) return pr;
  return (a.created||0) - (b.created||0);
}

const covers = (t, k) => !!t.date && (t.date === k || (!!t.endDate && t.date <= k && k <= t.endDate));
const lastDay = t => t.endDate && t.endDate > t.date ? t.endDate : t.date;
const onDay = k => all().filter(t => covers(t, k)).sort(sortTasks);
const spanLen = t => t.endDate && t.endDate > t.date ? Math.round((parseKey(t.endDate) - parseKey(t.date)) / 864e5) + 1 : 1;
const fmtRange = t => `${fmtDay(t.date,{month:'short',day:'numeric'})} to ${fmtDay(t.endDate,{month:'short',day:'numeric'})}`;

/* ---------- storage: account db when available, this device otherwise ---------- */
const LS = 'daybook.tasks.v1';
function lsLoad(){ try { JSON.parse(localStorage.getItem(LS) || '[]').forEach(t => S.tasks.set(t.id, t)); } catch {} }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify(all())); } catch {} }
const chains = new Map();
function enqueue(id, fn){
  const p = (chains.get(id) || Promise.resolve()).then(fn).catch(e => showError(e));
  chains.set(id, p);
}
function bodyOf(t){ const b = {...t}; delete b.id; return JSON.parse(JSON.stringify(b)); }
function saveTask(t, force){
  S.tasks.set(t.id, t);
  if (S.mode === 'db') enqueue(t.id, () => S.col.doc(t.id).set(bodyOf(t)));
  else lsSave();
  requestRender(force);
}
function removeTask(id){
  S.tasks.delete(id);
  if (S.openId === id) S.openId = null;
  if (S.mode === 'db') enqueue(id, () => S.col.doc(id).delete());
  else lsSave();
  requestRender(true);
}
function patch(id, fields, force){
  const t = S.tasks.get(id); if (!t) return;
  saveTask({...t, ...fields}, force);
}
function setSync(text, warn){
  const el = document.getElementById('sync');
  el.className = 'sync' + (warn ? ' warn' : '');
  el.innerHTML = text;
}
function showError(e){
  const code = e && e.code;
  const msg = code === 'quota_exceeded' ? 'Storage is full. Delete some old tasks to add new ones.'
    : code === 'revoked' ? 'Saving is no longer available on this page.'
    : 'A change could not be saved. Check your connection and try again.';
  setSync(msg, true);
}

function editingNow(){
  const a = document.activeElement;
  return a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
function requestRender(force){
  if (!force && editingNow()) { S.pending = true; return; }
  render();
}

function dayTimeline(day, items){
  const HOUR = 60;
  const routs = []; // routines live in their own column, not on the task timeline
  const isR = x => x.kind === 'routine';
  const rDone = x => !!(x.doneDates && x.doneDates[day]);
  const timed = items.filter(x => x.time).concat(routs.filter(x => x.time));
  const untimed = routs.filter(x => !x.time).concat(items.filter(x => !x.time));
  const mins = x => { const [h, m] = x.time.split(':').map(Number); return h * 60 + m; };
  const dur = x => { if (x.endTime) { const [h, m] = x.endTime.split(':').map(Number); const e = h * 60 + m; if (e > mins(x)) return Math.max(15, e - mins(x)); } return x.kind === 'routine' ? 30 : 60; };
  const isToday = day === todayKey();
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  let startH = 7, endH = 22;
  timed.forEach(x => { const m = mins(x); startH = Math.min(startH, Math.floor(m / 60)); endH = Math.max(endH, Math.min(24, Math.ceil((m + dur(x)) / 60) + 1)); });
  if (isToday) { startH = Math.min(startH, Math.floor(nowM / 60)); endH = Math.max(endH, Math.min(24, Math.floor(nowM / 60) + 1)); }
  // lanes for overlapping tasks (each block is treated as 1 hour)
  const sorted = timed.slice().sort((a, b) => mins(a) - mins(b) || sortTasks(a, b));
  // group tasks that overlap into clusters; only tasks in the same cluster share width
  const lane = new Map(), width = new Map();
  let cluster = [], laneEnd = [], clusterEnd = -1;
  const closeCluster = () => { cluster.forEach(id => width.set(id, Math.max(1, laneEnd.length))); cluster = []; laneEnd = []; };
  sorted.forEach(x => {
    const s = mins(x);
    if (s >= clusterEnd) closeCluster();
    let l = laneEnd.findIndex(e => e <= s); if (l === -1) l = laneEnd.length;
    laneEnd[l] = s + dur(x); lane.set(x.id, l); cluster.push(x.id);
    clusterEnd = Math.max(clusterEnd, s + dur(x));
  });
  closeCluster();
  let hours = '';
  for (let h = startH; h < endH; h++) {
    const label = h === 0 ? '12 am' : h < 12 ? `${h} am` : h === 12 ? '12 pm' : `${h - 12} pm`;
    hours += `<div class="tl-hour"><span class="tl-label">${label}</span></div>`;
  }
  const blocks = sorted.map(x => {
    const p = isR(x) ? 'routine' : (x.priority || 'med');
    const dn = isR(x) ? rDone(x) : x.done;
    const top = (mins(x) - startH * 60) / 60 * HOUR;
    const l = lane.get(x.id), lanes = width.get(x.id);
    const h = Math.max(18, dur(x) / 60 * HOUR - 3);
    return `<div class="ev ev-${p} ${dn?'done':''} ${S.openId===x.id?'open':''} ${h < 44 ? 'short' : ''} ${h < 26 ? 'tiny' : ''}" data-id="${x.id}" ${isR(x) ? `data-rday="${day}"` : ''} style="top:${top + 2}px;height:${h}px;left:calc(${l} * 100% / ${lanes});width:calc(100% / ${lanes} - 4px)">
      <button class="check" data-act="toggle" aria-label="${dn?'Mark not done':'Mark done'}: ${esc(x.title)}">${I.check}</button>
      <button class="ev-body" data-act="open">
        <span class="ev-t">${isR(x) ? `<span class="ev-ic">${I.repeat}</span>` : ''}${esc(x.title)}</span>
        <span class="ev-s">${fmtRange2(x)}${x.notes ? ' · ' + esc(x.notes) : ''}</span>
      </button>
      <button class="icon-btn ev-del" data-act="quick-del" aria-label="Delete ${esc(x.title)}" title="Delete">${I.trash}</button>
    </div>`;

    ${openTimed ? `<ul class="list tl-open">${isR(openTimed) ? routineItem(openTimed, day) : taskItem(openTimed, {day})}</ul>` : ''}
    <div class="tl" style="height:${(endH - startH) * HOUR}px">${hours}<div class="tl-events">${blocks}</div>${nowLine}</div>

}

function viewCalendar(){

document.addEventListener('click', e => {

  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.openId = null; render(); try { localStorage.setItem('daybook.tab', S.tab); } catch {} return; }

  const day = e.target.closest('[data-day]');

    const dv = document.getElementById('dayview');
    if (dv && dv.getBoundingClientRect().top > window.innerHeight * 0.6) dv.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});

  }

    return;
  }

  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  const host = act.closest('[data-id]');
  const id = host && host.dataset.id;
  const t = id && S.tasks.get(id);
  primeAudio();

  if (a === 'cal-prev' || a === 'cal-next') { const d = parseKey(S.month); d.setMonth(d.getMonth() + (a === 'cal-next' ? 1 : -1)); S.month = keyOf(d); render(); return; }
  if (a === 'cal-today') { const n = new Date(); S.month = keyOf(new Date(n.getFullYear(), n.getMonth(), 1)); S.selected = todayKey(); render(); return; }
  if (a === 'check-all' || a === 'uncheck-all') {
    const sc = act.dataset.scope;
    const want = a === 'check-all';
    const items = sc === 'later' ? remindersFor(todayKey()) : onDay(sc);
    items.filter(x => !!x.done !== want).forEach(x => saveTask({...x, done: want, doneOn: want ? todayKey() : null}, true));
    return;
  }

  if (a === 'toggle' && t.kind === 'routine') {

    if (dd[day]) delete dd[day]; else dd[day] = true;
    patch(id, {doneDates: dd}, true);
    return;
  }
  if (a === 'toggle') { patch(id, {done: !t.done, doneOn: !t.done ? todayKey() : null}, true); return; }
  if (a === 'open') { S.openId = S.openId === id ? null : id; S.armedDelete = null; render(); return; }
  if (a === 'close') { S.openId = null; S.armedDelete = null; render(); return; }
  if (a === 'to-today') {
    const tk = todayKey();
    const len = spanLen(t);
    patch(id, {date: tk, endDate: len > 1 ? addDays(tk, len - 1) : null, fired: false}, true);
    return;
  }
  if (a === 'quick-del') { const copy = {...t}; removeTask(id); undoToast(copy); return; }
  if (a === 'del') {
    if (S.armedDelete === id) { S.armedDelete = null; removeTask(id); }
    else { S.armedDelete = id; render(); setTimeout(() => { if (S.armedDelete === id) { S.armedDelete = null; requestRender(); } }, 4000); }
    return;
  }
  if (a === 'sub-toggle' || a === 'sub-del') {
    const i = Number(act.dataset.i);
    const subs = (t.subs || []).map(s => ({...s}));
    if (a === 'sub-toggle') subs[i].done = !subs[i].done; else subs.splice(i, 1);
    patch(id, {subs}, true);
  }
});

document.addEventListener('change', e => {

  }
  const fields = {[f]: v};
  if (f === 'date' || f === 'time' || f === 'remind') { fields.fired = false; fields.snooze = null; }
  patch(id, fields);
});

document.addEventListener('keydown', e => {

let audioCtx = null;
function primeAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch {} }
function chime(){
  try {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const t0 = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i*.16); g.gain.linearRampToValueAtTime(.18, t0 + i*.16 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i*.16 + .6);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + i*.16); o.stop(t0 + i*.16 + .65);
    });
  } catch {}
}
const shown = new Set();
function toast(t){
  if (shown.has(t.id)) return; shown.add(t.id);
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  const when = t.date ? `${relDay(t.date)}${t.time ? ' at ' + fmtTime(t.time) : ''}` : '';
  el.innerHTML = `<span class="bell">${I.bell}</span>
    <div class="toast-body"><strong></strong><span>${esc(when ? 'Due ' + when : 'Reminder')}</span>
      <div class="toast-actions"><button class="btn btn-primary" data-t="done">Mark done</button><button class="btn btn-quiet" data-t="snooze">Snooze 10 min</button></div></div>
    <button class="icon-btn" data-t="close" aria-label="Dismiss">${I.x}</button>`;
  el.querySelector('strong').textContent = t.title;
  el.addEventListener('click', ev => {
    const b = ev.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.t === 'done') patch(t.id, {done: true, doneOn: todayKey()}, true);
    if (b.dataset.t === 'snooze') patch(t.id, {snooze: Date.now() + 10*60000, fired: false}, true);
    shown.delete(t.id); el.remove();
  });
  box.prepend(el);
  chime();
  deskNotify(t, when);
}

async function deskSync(){

function undoToast(copy){

function checkReminders(){

  all().forEach(t => {
    if (t.done || t.fired) return;
    const at = t.snooze || remindAt(t);
    if (at && at <= now && now - at < 12 * 3600e3) { toast(t); patch(t.id, {fired: true, snooze: null}); }
  });
}

/* ---------- boot ---------- */
try { const saved = localStorage.getItem('daybook.tab'); if (['today','calendar','food'].includes(saved)) S.tab = saved; } catch {}
lsLoad();
setSync(I.device + ' Loading…');
render();
initDb();
initDesktop();
const ET = 'America/New_York';
const etTime = new Intl.DateTimeFormat('en-US', {timeZone: ET, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true, timeZoneName: 'short'});
const etDate = new Intl.DateTimeFormat('en-US', {timeZone: ET, weekday: 'long', month: 'long', day: 'numeric'});
function tickClock(){
  const n = new Date();
  const p = {}; etTime.formatToParts(n).forEach(x => { p[x.type] = x.value; });
  document.getElementById('clock-hm').textContent = p.hour + ':' + p.minute;
  document.getElementById('clock-s').textContent = ':' + p.second;
  document.getElementById('clock-ap').textContent = (p.dayPeriod || '') + ' ' + (p.timeZoneName || 'ET');
  document.getElementById('clock-date').textContent = etDate.format(n);
  let hitZero = false;
  document.querySelectorAll('.cd[data-at]').forEach(el => {
    const left = Number(el.dataset.at) - n.getTime();
    el.textContent = fmtCountdown(left);
    el.classList.toggle('soon', left > 0 && left < 5 * 60000);
    if (left <= 0) hitZero = true;
  });
  if (hitZero) { checkReminders(); requestRender(); }
  setTimeout(tickClock, 1000 - n.getMilliseconds() + 5);
}
tickClock();
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 1500);
// roll over at midnight
let curDay = todayKey();
setInterval(() => { curDay = todayKey(); requestRender(); }, 60000);
})();
</script>
